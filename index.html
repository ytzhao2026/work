<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#5a9e7e">
<title>个人自律工作台</title>
<style>
  :root{
    --green-50:#f1f8f4;
    --green-100:#e3f1ea;
    --green-200:#c6e3d3;
    --green-300:#9fceb2;
    --green-400:#74b692;
    --green-500:#5a9e7e;
    --green-600:#47815f;
    --green-700:#38654a;
    --ink:#2c3a32;
    --muted:#7c8b81;
    --bg:#f7faf8;
    --card:#ffffff;
    --line:#e6efe9;
    --shadow:0 4px 18px rgba(70,129,95,.08);
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
    overflow-x:hidden;
  }
  .app{display:flex;min-height:100vh;}

  /* ---- 侧边栏 ---- */
  .sidebar{
    width:208px;flex:0 0 208px;background:linear-gradient(180deg,var(--green-600),var(--green-700));
    color:#eaf4ee;display:flex;flex-direction:column;transition:width .28s ease,flex-basis .28s ease;
    position:sticky;top:0;height:100vh;overflow:hidden;
  }
  .sidebar.collapsed{width:60px;flex-basis:60px;}
  .brand{
    display:flex;align-items:center;gap:10px;padding:18px 16px;font-weight:700;font-size:16px;
    border-bottom:1px solid rgba(255,255,255,.12);white-space:nowrap;
  }
  .brand .logo{width:28px;height:28px;border-radius:8px;background:#fff;color:var(--green-600);
    display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 28px;}
  .sidebar.collapsed .brand span{opacity:0;}
  .nav{flex:1;overflow-y:auto;padding:10px 8px;}
  .nav-item{
    display:flex;align-items:center;gap:12px;padding:12px 12px;border-radius:10px;cursor:pointer;
    margin-bottom:4px;color:#e3f1ea;white-space:nowrap;transition:background .2s;font-size:14.5px;
  }
  .nav-item .ico{width:28px;height:28px;flex:0 0 28px;display:flex;align-items:center;justify-content:center;border-radius:8px;overflow:hidden;background:#fff3;}
  .nav-item .ico img{width:100%;height:100%;object-fit:cover;border-radius:6px;}
  .nav-item.active .ico{background:none;}
  .nav-item .txt{opacity:1;transition:opacity .2s;}
  .sidebar.collapsed .nav-item .txt{opacity:0;width:0;overflow:hidden;}
  .nav-item:hover{background:rgba(255,255,255,.10);}
  .nav-item.active{background:#fff;color:var(--green-700);font-weight:600;
    box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .toggle{
    padding:14px 16px;border-top:1px solid rgba(255,255,255,.12);cursor:pointer;
    display:flex;align-items:center;gap:10px;font-size:13px;color:#d4ead0;white-space:nowrap;
  }
  .toggle .ico{flex:0 0 22px;text-align:center;font-size:16px;}
  .sidebar.collapsed .toggle .txt{opacity:0;width:0;overflow:hidden;}

  /* ---- 主区域 ---- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;}
  .topbar{
    position:sticky;top:0;z-index:5;background:rgba(247,250,248,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px;
  }
  .menu-btn{display:none;background:var(--green-100);border:none;color:var(--green-700);
    width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer;}
  .topbar h1{font-size:17px;margin:0;font-weight:700;color:var(--green-700);}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .topbar .date{font-size:12px;color:var(--muted);}
  .topbar .ver{font-size:10.5px;color:var(--green-600);background:var(--green-100);
    padding:2px 7px;border-radius:20px;font-weight:600;white-space:nowrap;}
  .content{flex:1;overflow-y:auto;padding:18px;padding-bottom:40px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 16px;margin-bottom:14px;box-shadow:var(--shadow);}
  .section-title{font-size:16px;font-weight:700;color:var(--green-700);margin:0 0 4px;
    display:flex;align-items:center;gap:8px;}
  .section-sub{font-size:12.5px;color:var(--muted);margin:0 0 12px;}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;
    background:var(--green-100);color:var(--green-600);margin-left:6px;}

  .tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;}
  .tag-a{background:#fde8e8;color:#c0392b;}
  .tag-b{background:#fef3da;color:#b9770e;}
  .tag-c{background:#e6efe9;color:#47815f;}

  .task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line);}
  .task:last-child{border-bottom:none;}
  .task .num{flex:0 0 24px;height:24px;border-radius:50%;background:var(--green-500);color:#fff;
    font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700;margin-top:2px;}
  .task .body{flex:1;}
  .task .t{font-weight:600;color:var(--ink);}
  .task .r{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .cat{font-size:11px;color:var(--green-600);font-weight:600;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .mini{background:var(--green-50);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .mini .k{font-size:11.5px;color:var(--muted);}
  .mini .v{font-size:15px;font-weight:700;color:var(--green-700);}

  .btn{background:var(--green-500);color:#fff;border:none;border-radius:10px;padding:9px 14px;
    font-size:14px;cursor:pointer;font-weight:600;transition:background .2s;}
  .btn:active{background:var(--green-600);}
  .btn.ghost{background:var(--green-100);color:var(--green-700);}
  .btn.sm{padding:6px 10px;font-size:12.5px;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

  textarea,input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font-size:14px;font-family:inherit;background:#fff;color:var(--ink);margin-top:6px;outline:none;}
  textarea:focus,input:focus,select:focus{border-color:var(--green-400);}
  label{font-size:12.5px;color:var(--muted);font-weight:600;display:block;margin-top:10px;}

  .list-row{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);
    border-radius:10px;margin-bottom:8px;background:#fff;}
  .list-row .info{flex:1;min-width:0;}
  .list-row .info .t{font-weight:600;font-size:14px;}
  .list-row .info .s{font-size:12px;color:var(--muted);}
  .list-row .del{background:#fde8e8;color:#c0392b;border:none;border-radius:8px;padding:5px 9px;
    font-size:12px;cursor:pointer;flex:0 0 auto;}

  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);}
  th{color:var(--green-600);font-weight:600;font-size:12px;}

  .quote{background:var(--green-50);border-left:3px solid var(--green-400);border-radius:8px;
    padding:10px 12px;font-size:13px;color:var(--ink);margin:8px 0;}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:14px;}

  /* ---- 视频 / 外链卡片 ---- */
  .vcard{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:11px 12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(70,129,95,.05);}
  .vcard .thumb{flex:0 0 64px;width:64px;height:64px;border-radius:10px;display:flex;align-items:center;
    justify-content:center;font-size:26px;color:#fff;overflow:hidden;}
  .vcard .vmeta{flex:1;min-width:0;}
  .vcard .vtitle{font-weight:600;font-size:13.5px;color:var(--ink);line-height:1.35;}
  .vcard .vsub{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .vcard .vopen{flex:0 0 auto;background:var(--green-500);color:#fff;border:none;border-radius:9px;
    padding:7px 11px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .vcard .vopen:active{background:var(--green-600);}
  .vcard.focus{border-color:var(--green-500);box-shadow:0 0 0 2px rgba(90,158,126,.22);background:var(--green-50);}
  .badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px;
    margin-right:6px;vertical-align:middle;color:#fff;}
  .badge.bili{background:#fb7299;}
  .badge.xhs{background:#ff2742;}
  .badge.dy{background:#000;}
  .badge.blog{background:#47815f;}
  .badge.yt{background:#ff0000;}

  /* ---- 书单分类 ---- */
  .bookcase{margin-bottom:14px;}
  .bookcase .bk-h{font-weight:700;font-size:13.5px;color:var(--green-700);margin-bottom:8px;
    display:flex;align-items:center;gap:6px;}
  .bookcase .bk-h .dot{width:8px;height:8px;border-radius:50%;background:var(--green-400);flex:0 0 8px;}
  .book{display:flex;gap:11px;align-items:flex-start;background:#fff;border:1px solid var(--line);
    border-radius:11px;padding:10px 11px;margin-bottom:8px;box-shadow:0 2px 8px rgba(70,129,95,.05);}
  .book .cover{flex:0 0 40px;width:40px;height:54px;border-radius:6px;display:flex;align-items:center;
    justify-content:center;font-size:20px;color:#fff;font-weight:700;}
  .book .binfo{flex:1;min-width:0;}
  .book .bt{font-weight:700;font-size:13.5px;color:var(--ink);}
  .book .ba{font-size:11.5px;color:var(--muted);margin:2px 0 4px;}
  .book .bd{font-size:12px;color:#4a5a50;line-height:1.45;}
  .book .blink{display:inline-block;margin-top:5px;font-size:11.5px;color:var(--green-600);
    text-decoration:none;font-weight:600;cursor:pointer;}

  .bar{height:8px;border-radius:6px;background:var(--green-100);overflow:hidden;margin-top:6px;}
  .bar > i{display:block;height:100%;background:var(--green-500);border-radius:6px;}

  /* ---- 历史记录 / 保存输入 ---- */
  .history-list{margin-top:10px;}
  .history-item{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff;}
  .hist-date{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--green-600);
    background:var(--green-100);border-radius:20px;padding:2px 9px;margin-top:2px;white-space:nowrap;}
  .hist-content{flex:1;min-width:0;font-size:13px;color:#4a5a50;line-height:1.55;white-space:pre-line;word-break:break-word;}
  .history-item .del{background:#fde8e8;color:#c0392b;border:none;border-radius:8px;padding:5px 9px;
    font-size:12px;cursor:pointer;flex:0 0 auto;}
  .input-group{margin-top:8px;}
  .input-group label{margin-top:8px;}
  .save-btn{background:var(--green-600);color:#fff;border:none;border-radius:10px;padding:10px 16px;
    font-size:14px;cursor:pointer;font-weight:700;transition:background .2s;box-shadow:0 3px 10px rgba(70,129,95,.25);}
  .save-btn:active{background:var(--green-700);}
  .month-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;
    background:var(--green-50);}
  .month-card .mc-h{font-weight:700;font-size:13.5px;color:var(--green-700);margin-bottom:6px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;}

  .totop{position:fixed;right:18px;bottom:22px;width:46px;height:46px;border-radius:50%;
    background:var(--green-500);color:#fff;border:none;font-size:20px;cursor:pointer;
    box-shadow:0 6px 16px rgba(70,129,95,.35);display:none;z-index:20;}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:8;display:none;}
  .overlay.show{display:block;}

  /* 手机适配：菜单栏顶部横向铺开，不折叠 */
  @media (max-width:720px){
    .app{flex-direction:row!important;align-items:stretch;}
    .sidebar{position:sticky;top:0;left:0;width:128px!important;flex:0 0 128px!important;height:100vh!important;
      flex-direction:column!important;overflow:visible;z-index:20;
      background:linear-gradient(180deg,var(--green-600),var(--green-700));}
    .brand{display:flex!important;padding:14px 10px;font-size:13px;justify-content:center;text-align:center;}
    .brand .logo{display:none;}
    .nav{display:flex!important;flex-direction:column!important;overflow-y:auto;overflow-x:hidden;
      padding:8px 6px!important;gap:0;scrollbar-width:thin;}
    .nav::-webkit-scrollbar{width:3px;}
    .nav-item{flex:0 0 auto!important;display:flex!important;flex-direction:row!important;gap:8px!important;
      align-items:center;padding:11px 8px!important;margin-bottom:4px!important;border-radius:10px!important;
      text-align:left!important;min-width:0!important;width:100%!important;background:transparent!important;}
    .nav-item .ico{width:26px!important;height:26px!important;flex:0 0 26px!important;}
    .nav-item .txt{font-size:12.5px!important;opacity:1!important;width:auto!important;overflow:visible!important;
      white-space:nowrap!important;color:#eaf4ee!important;}
    .nav-item.active{background:#fff!important;color:var(--green-700)!important;
      box-shadow:0 2px 8px rgba(0,0,0,.1)!important;}
    .nav-item.active .txt{color:var(--green-700)!important;font-weight:600!important;}
    .menu-btn{display:none!important;}
    .main{height:100vh!important;min-height:0;flex:1;min-width:0;}
    .topbar{position:sticky;top:0;padding:10px 14px;}
    .topbar h1{font-size:15px;}
    .content{padding:12px;padding-bottom:40px;overflow-y:auto;}
    .grid2{grid-template-columns:1fr;}
    .card{border-radius:12px;padding:14px;}
  }
  .hidden{display:none!important;}
  .fade{animation:fade .3s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
</style>
</head>

      <div class="task"><div class="num">2</div><div class="body"><div class="t">英语：固定晚8点15分钟跟读，绑定"洗漱后"习惯锚点</div><div class="r">💡 打卡从17→22天。</div></div></div>
      <div class="task"><div class="num">3</div><div class="body"><div class="t">体态：增加工作日"每小时靠墙站1分钟"，降低圆肩复发</div><div class="r">💡 不必只靠周末补课。</div></div></div>
      <div class="task"><div class="num">4</div><div class="body"><div class="t">自律：每周日晚花10分钟预排下周三件事，减少临时救火</div><div class="r">💡 执行率冲90%。</div></div></div>
    </div>`;
  }
};

/* ============ 交互逻辑 ============ */
const titles = {plan:'每日计划',ledger:'工作台账',english:'商务英语',reading:'阅读总结',money:'记账存钱',body:'体态管理',mood:'心情树洞',monthly:'月度复盘'};

function render(key){
  const c = $('#content');
  c.innerHTML = views[key]();
  $('#pageTitle').textContent = titles[key];
  if(key==='money') renderMoney();
  if(key==='mood') renderMood();
  if(key==='ledger') renderLedger();
  c.scrollTop = 0;
}

function copyText(id){
  const t = $('#'+id).innerText;
  navigator.clipboard?.writeText(t).then(()=>alert('已复制 ✓'),()=>alert('复制失败，请手动选择'));
}

function speak(text){
  if('speechSynthesis' in window){
    const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.9;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }else{alert('当前浏览器不支持语音，请手动跟读。');}
}

/* 打开外部链接（视频/书单） */
function openExternal(url){
  if(!url){alert('暂未配置链接，可手动在对应平台搜索标题。');return;}
  const w = window.open(url, '_blank', 'noopener');
  if(!w){alert('浏览器拦截了新窗口，请允许弹窗后重试。');}
}

/* 每日计划：保存 + 历史 */
function savePlan(){
  const items = [$('#p1').value.trim(), $('#p2').value.trim(), $('#p3').value.trim()];
  if(!items[0] && !items[1] && !items[2]){alert('至少写一件事再保存');return;}
  const logs = store.get('plan_logs',[]);
  const today = todayStr();
  const idx = logs.findIndex(l=>l.d===today);
  if(idx>=0) logs[idx].items = items;
  else logs.unshift({d:today, items});
  store.set('plan_logs',logs);
  render('plan');
}
function delPlanLog(i){
  const logs = store.get('plan_logs',[]);
  logs.splice(i,1);
  store.set('plan_logs',logs);
  render('plan');
}

/* 台账：简易智能归类 */
function analyzeLedger(){
  const raw = $('#ledIn').value.trim();
  if(!raw){alert('请先粘贴客户沟通内容');return;}
  const blocks = raw.split(/\n\s*\n/).filter(Boolean);
  const data = blocks.map(b=>{
    const t = b.toLowerCase();
    let level='C', point='需进一步试探意向', next='7天内回访';
    if(/(签约|确认|付款|下单|价格|报价|预算|决策)/.test(b)) level='A';
    else if(/(考虑|对比|试用|再砍|敏感|回复|观望)/.test(b)) level='B';
    if(/预算|批复|决策|等/.test(b)) point='决策卡点：内部审批/预算未定';
    if(/周五|下周|两周|周一|月底/.test(b)){const m=b.match(/(周五|下周|两周后|周一|月底)/);next=(m?m[1]:'7天')+'内跟进';}
    return {txt:b.slice(0,60)+(b.length>60?'…':''),level,point,next};
  });
  store.set('ledger',data);
  renderLedger();
  $('#ledPreview').style.display='block';
  $('#ledIn').value='';
}
function renderLedger(){
  const data = store.get('ledger',[]);
  const tag = l=>`<span class="tag tag-${l.toLowerCase()}">${l}类</span>`;
  $('#ledList').innerHTML = data.length? data.map(d=>`
    <div class="list-row"><div class="info">
      <div class="t">${tag(d.level)} ${d.txt}</div>
      <div class="s">卡点：${d.point} · 跟进：${d.next}</div>
    </div></div>`).join('') : '<div class="empty">暂无台账，粘贴沟通记录后生成</div>';
}
function clearLedger(){store.set('ledger',[]);renderLedger();$('#ledPreview').style.display='none';}

/* 阅读提炼 */
function extractRead(){
  const v = $('#readIn').value.trim();
  if(!v){alert('请先粘贴阅读片段');return;}
  $('#readOut').innerHTML = `
    <div class="section-title" style="font-size:14px;margin-top:12px">✨ 提炼结果</div>
    <div class="task"><div class="num">1</div><div class="body"><div class="t">把"互惠"做进第一次接触</div><div class="r">💡 先给客户一份行业资料/小工具，再提合作，答应率更高。</div></div></div>
    <div class="task"><div class="num">2</div><div class="body"><div class="t">把恩惠和"你的核心诉求"绑定</div><div class="r">💡 别乱给，给的恰好是他正愁的那点，才值钱。</div></div></div>
    <div class="task"><div class="num">3</div><div class="body"><div class="t">本周挑1个客户试用</div><div class="r">💡 读完不落地=没读，今晚就发一份定制资料给重点客户A。</div></div></div>`;
}

/* 记账 */
function addMoney(){
  const cat=$('#mCat').value, amt=parseFloat($('#mAmt').value), note=$('#mNote').value.trim();
  if(!amt||amt<=0){alert('请输入有效金额');return;}
  const recs=store.get('money',[]);
  recs.unshift({cat,amt,note:note||'—',d:todayStr()});
  store.set('money',recs);
  $('#mAmt').value='';$('#mNote').value='';
  renderMoney();
}
function renderMoney(){
  const recs=store.get('money',[]);
  const total={bus:0,tra:0,per:0};recs.forEach(r=>total[r.cat]+=r.amt);
  const sum=total.bus+total.tra+total.per;
  const names={bus:'业务招待',tra:'交通差旅',per:'个人日常'};
  $('#saveTip').innerHTML = sum>0
    ? `💡 储蓄小建议：本月业务招待占比 ${((total.bus/sum)*100).toFixed(0)}%，若控制在营收的8%内即健康；个人日常可设"周额度"，超了从下周午饭自降一档。`
    : '💡 本月还没记账，随手记一笔就有数据啦。';
  $('#moneyList').innerHTML = recs.length? recs.map((r,i)=>`
    <div class="list-row"><div class="info">
      <div class="t">${names[r.cat]} · ¥${r.amt.toFixed(0)}</div>
      <div class="s">${r.d} · ${r.note}</div>
    </div><button class="del" onclick="delMoney(${i})">删</button></div>`).join('')
    : '<div class="empty">暂无记录</div>';
}
function delMoney(i){const recs=store.get('money',[]);recs.splice(i,1);store.set('money',recs);renderMoney();}

/* 体态分析 */
function bodyAnalyze(){
  const bf=parseFloat($('#bf').value), bw=parseFloat($('#bw').value), bm=parseFloat($('#bm').value);
  if(!bf&&!bw){alert('至少填一项体脂或体重');return;}
  let tip='';
  if(bf>23) tip='体脂偏高，下周把周日有氧提到40分钟，工作日每天多走2000步；';
  else if(bf<20) tip='体脂偏低，别只练有氧，加蛋白质摄入，保住肌肉量；';
  else tip='体脂在健康区间，维持即可，重点放在体态矫正；';
  if(bw>57) tip+='体重略超基线，晚餐碳水减半、周末训练加一组核心；';
  else if(bw<55) tip+='体重偏轻，留意久坐导致的"虚胖假象"，以塑形为主；';
  tip+='圆肩记得每天靠墙站，骨盆前倾多做卷腹卷骨盆，小腿外翻继续周日放松+内收训练。';
  $('#bodyOut').innerHTML = `<div class="quote">📋 下周微调：${tip}</div>`;
}

/* 月度复盘：保存 + 历史 */
function saveMonthly(){
  const sale=parseFloat($('#mSale').value), eng=parseFloat($('#mEng').value),
        bf=parseFloat($('#mBf').value), exec=parseFloat($('#mExec').value);
  if(isNaN(sale)&&isNaN(eng)&&isNaN(bf)&&isNaN(exec)){alert('至少填一项数据再保存');return;}
  const logs = store.get('monthly_logs',[]);
  const ym = monthStr();
  const rec = {
    ym,
    sale: isNaN(sale)?0:sale,
    eng:  isNaN(eng)?0:eng,
    bf:   isNaN(bf)?0:bf,
    exec: isNaN(exec)?0:exec
  };
  const idx = logs.findIndex(l=>l.ym===ym);
  if(idx>=0) logs[idx] = rec;
  else logs.unshift(rec);
  store.set('monthly_logs',logs);
  render('monthly');
}
function delMonthlyLog(i){
  const logs = store.get('monthly_logs',[]);
  logs.splice(i,1);
  store.set('monthly_logs',logs);
  render('monthly');
}

/* 心情树洞 */
function addMood(){
  const v=$('#moodIn').value.trim();
  if(!v){alert('写点什么吧，说出来轻一点');return;}
  const reply = moodReply(v);
  const logs=store.get('mood',[]);
  logs.unshift({t:v,d:todayStr(),r:reply});
  store.set('mood',logs);
  $('#moodIn').value='';
  $('#moodOut').innerHTML=`<div class="quote">🌿 ${reply}</div>`;
  renderMood();
}
function moodReply(v){
  if(/丢单|截胡|没成|失败|输/.test(v)) return '截胡的是价格，不是你这个人。把这次拆成"需求/信任/决策"三步看，真正丢在哪一步，哪一步就是下次的护城河。';
  if(/累|加班|压力|焦虑|喘/.test(v)) return '压力不是敌人，是信号：说明你在意结果。把"我必须搞定"换成"我先搞定能搞定的那一步"，掌控感会回来。';
  if(/客户|刁难|难搞|投诉/.test(v)) return '难搞的客户往往是最在意的人。把他当成"帮你把方案打磨更硬"的免费教练，情绪就少一半。';
  return '情绪先接住，再拆解：这件事里，哪些是你能控制的（话术/跟进节奏），哪些不是（对方预算/老板）。把精力只投在前半部分，心就稳了。';
}
function renderMood(){
  const logs=store.get('mood',[]);
  $('#moodList').innerHTML = logs.length? logs.map(l=>`
    <div class="list-row" style="flex-direction:column;align-items:stretch">
      <div class="info"><div class="t">${l.d}</div><div class="s">${l.t}</div></div>
      <div class="quote" style="margin:8px 0 0">🌿 ${l.r}</div>
    </div>`).join('') : '<div class="empty">树洞空空，今天有什么想说的？</div>';
}
function clearMood(){store.set('mood',[]);renderMood();$('#moodOut').innerHTML='';}

/* 侧边栏交互 */
const sidebar=$('#sidebar'), overlay=$('#overlay');
$$('.nav-item').forEach(it=>{
  it.addEventListener('click',()=>{
    $$('.nav-item').forEach(x=>x.classList.remove('active'));
